[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rail-punctuality"
version = "0.1.0"
description = "How late are India's long-distance trains? Six months of running history for 136 trains, collected politely and analysed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhishek Pandey" }]
dependencies = ["pandas>=2.1", "matplotlib>=3.8", "certifi"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
