<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="1200" height="660" fill="#FFFFFF"/>
<text x="40" y="52" font-size="28" fill="#0F172A" font-weight="700">Indian rail punctuality: what we get from it</text>
<text x="40" y="80" font-size="15" fill="#475569">136 long-distance trains · 11 Apr - 7 Oct 2026 · delay at the destination</text>
<rect x="24" y="104" width="560" height="330" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="44" y="136" font-size="16" fill="#0F172A" font-weight="700">On time at destination, by train type</text>
<text x="44" y="158" font-size="12" fill="#64748B">within 15 minutes · 20,461 runs</text>
<text x="172" y="193" font-size="13" fill="#0F172A" font-weight="700" text-anchor="end">Shatabdi</text>
<rect x="184" y="174" width="280" height="28" rx="4" fill="#F1F5F9"/>
<rect x="184" y="174" width="226.2" height="28" rx="4" fill="#2563EB"/>
<text x="400.15599999999995" y="193" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="end">81%</text>
<text x="172" y="233" font-size="13" fill="#0F172A" font-weight="700" text-anchor="end">Rajdhani</text>
<rect x="184" y="214" width="280" height="28" rx="4" fill="#F1F5F9"/>
<rect x="184" y="214" width="224.8" height="28" rx="4" fill="#2563EB"/>
<text x="398.784" y="233" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="end">80%</text>
<text x="172" y="273" font-size="13" fill="#0F172A" font-weight="700" text-anchor="end">Vande Bharat</text>
<rect x="184" y="254" width="280" height="28" rx="4" fill="#F1F5F9"/>
<rect x="184" y="254" width="224.3" height="28" rx="4" fill="#2563EB"/>
<text x="398.252" y="273" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="end">80%</text>
<text x="172" y="313" font-size="13" fill="#334155" text-anchor="end">Superfast</text>
<rect x="184" y="294" width="280" height="28" rx="4" fill="#F1F5F9"/>
<rect x="184" y="294" width="162.2" height="28" rx="4" fill="#94A3B8"/>
<text x="336.204" y="313" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="end">58%</text>
<text x="172" y="353" font-size="13" fill="#334155" text-anchor="end">Duronto</text>
<rect x="184" y="334" width="280" height="28" rx="4" fill="#F1F5F9"/>
<rect x="184" y="334" width="145.2" height="28" rx="4" fill="#94A3B8"/>
<text x="319.236" y="353" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="end">52%</text>
<text x="172" y="393" font-size="13" fill="#334155" text-anchor="end">Mail/Express</text>
<rect x="184" y="374" width="280" height="28" rx="4" fill="#F1F5F9"/>
<rect x="184" y="374" width="124.6" height="28" rx="4" fill="#94A3B8"/>
<text x="298.628" y="393" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="end">45%</text>
<rect x="608" y="104" width="568" height="330" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="628" y="136" font-size="16" fill="#0F172A" font-weight="700">One corridor, a third of the big delays</text>
<text x="628" y="158" font-size="12" fill="#64748B">trains via Kharagpur, Tatanagar, Chakradharpur, Rourkela</text>
<text x="776" y="189" font-size="13" fill="#0F172A" font-weight="700" text-anchor="end">10 corridor trains</text>
<rect x="788" y="170" width="230" height="28" rx="4" fill="#F1F5F9"/>
<rect x="788" y="170" width="213.3" height="28" rx="4" fill="#EA580C"/>
<text x="991.325" y="189" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="end">186 min</text>
<text x="776" y="233" font-size="13" fill="#334155" text-anchor="end">126 other trains</text>
<rect x="788" y="214" width="230" height="28" rx="4" fill="#F1F5F9"/>
<rect x="788" y="214" width="33.9" height="28" rx="4" fill="#94A3B8"/>
<text x="829.925" y="233" font-size="13" fill="#334155" font-weight="700">30 min</text>
<text x="828" y="266" font-size="11" fill="#475569" text-anchor="middle">average delay at destination</text>
<text x="628" y="304" font-size="13" fill="#334155">7% of the trains cause 30% of all runs that are</text>
<text x="628" y="326" font-size="13" fill="#334155">more than an hour late. Every one of the 4 worst</text>
<text x="628" y="348" font-size="13" fill="#334155">trains (Howrah-Mumbai Mail, both Howrah-Pune</text>
<text x="628" y="370" font-size="13" fill="#334155">Durontos) runs this way.</text>
<rect x="24" y="458" width="276" height="182" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="44" y="504" font-size="34" fill="#1D4ED8" font-weight="800">41 min</text>
<text x="44" y="534" font-size="14" fill="#0F172A" font-weight="700">average delay</text>
<text x="44" y="558" font-size="12" fill="#475569">but the median is 6 min: most</text>
<text x="44" y="576" font-size="12" fill="#475569">runs are near time, a long tail</text>
<text x="44" y="594" font-size="12" fill="#475569">of very late runs pulls it up</text>
<rect x="316" y="458" width="276" height="182" rx="14" fill="#F0FDF4" stroke="#BBF7D0"/>
<text x="336" y="504" font-size="34" fill="#15803D" font-weight="800">68%</text>
<text x="336" y="534" font-size="14" fill="#0F172A" font-weight="700">of runs arrive on time</text>
<text x="336" y="558" font-size="12" fill="#475569">18% are over an hour late;</text>
<text x="336" y="576" font-size="12" fill="#475569">best: Ahmedabad Rajdhani</text>
<text x="336" y="594" font-size="12" fill="#475569">(12958), 98% on time</text>
<rect x="608" y="458" width="276" height="182" rx="14" fill="#FFFBEB" stroke="#FDE68A"/>
<text x="628" y="504" font-size="34" fill="#B45309" font-weight="800">15 min</text>
<text x="628" y="534" font-size="14" fill="#0F172A" font-weight="700">won back on the final leg</text>
<text x="628" y="558" font-size="12" fill="#475569">83% of runs arrive less late</text>
<text x="628" y="576" font-size="12" fill="#475569">than at the previous stop:</text>
<text x="628" y="594" font-size="12" fill="#475569">timetables pad the last leg</text>
<rect x="900" y="458" width="276" height="182" rx="14" fill="#FAF5FF" stroke="#E9D5FF"/>
<text x="920" y="504" font-size="34" fill="#6E56CF" font-weight="800">0.58</text>
<text x="920" y="534" font-size="14" fill="#0F172A" font-weight="700">route length vs delay</text>
<text x="920" y="558" font-size="12" fill="#475569">longer routes run later</text>
<text x="920" y="576" font-size="12" fill="#475569">(rank correlation); weekday</text>
<text x="920" y="594" font-size="12" fill="#475569">makes almost no difference</text>
</svg>
